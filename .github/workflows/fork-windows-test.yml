# FORK ONLY (aknuth/mailcraft, proto/blitz-reading): a Windows x64 and Linux x86_64 (AppImage,
# deb, rpm, tar.gz) test build for trying the Blitz prototype out, published as a pre-release of
# this repository. Started by pushing a tag
# `wintest-<n>` on the commit to build (a workflow on another branch than the default one can't be
# run from the Actions page), or there once it's on the default branch. Its builds update
# themselves from this repository's releases (MAILCRAFT_UPDATE_REPO), never from ZIDAN44's.
# The jobs and the publishing are release.yml's, cut down to two platforms.
name: Test build (fork)

on:
  push:
    tags: ["wintest-*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override, e.g. 0.34.1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: fork-windows-test
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # As release-wip.yml pins it.
  CRAFT_FONTS_REF: b076417b5880bd4154bd22f00695b1d28c6bea83
  UNSIGNED_BUILD: "1"
  MAILCRAFT_UPDATE_CHANNEL: test
  MAILCRAFT_UPDATE_REPO: ${{ github.repository }}
  # Sign in with Microsoft: the fork owner's Entra app (public client, no secret; not secret).
  MAILCRAFT_MICROSOFT_CLIENT_ID: cb70b375-2c2a-410e-a006-af0ec424f969

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
      date: ${{ steps.v.outputs.date }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        name: Resolve version
        uses: storytold/craft-common-actions/actions/resolve-version@main
        with:
          input-version: ${{ inputs.version || '' }}
          app-title: MailCraft (Windows test build)
      - id: tag
        name: Tag
        env:
          VERSION: ${{ steps.v.outputs.version }}
          RUN: ${{ github.run_number }}
        run: echo "tag=v$VERSION-test.$RUN" >>"$GITHUB_OUTPUT"

  windows:
    name: Windows x64
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_DATE: ${{ needs.version.outputs.date }}
      BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: ${{ env.CRAFT_FONTS_REF }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: fork-windows-x64
      - name: Apply version override
        if: inputs.version != '' && inputs.version != null
        shell: bash
        run: cargo xtask version set "$VERSION"
      - name: Install WiX
        uses: storytold/craft-common-actions/actions/install-wix@main
        with:
          wix-version: "5.0.2"
      - name: Build and package (unsigned)
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x64
          path: dist/release/*
          if-no-files-found: error

  linux:
    name: Linux x86_64
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_DATE: ${{ needs.version.outputs.date }}
      BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: ${{ env.CRAFT_FONTS_REF }}
      - uses: storytold/craft-common-actions/actions/install-linux-deps@main
        with:
          deb-arch: amd64
          nfpm-version: "2.47.0"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: fork-linux-x86_64
      - name: Apply version override
        if: inputs.version != '' && inputs.version != null
        run: cargo xtask version set "$VERSION"
      - name: Build and package (AppImage, deb, rpm, tar.gz)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/linux/package.sh
      - name: Check the packages
        run: |
          dpkg-deb --info dist/release/*.deb
          for appimage in dist/release/*.AppImage; do
            chmod +x "$appimage"
            APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-x86_64
          path: dist/release/*
          if-no-files-found: error

  release:
    name: Publish the test build
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum -- * | tee SHA256SUMS.txt
      - name: Publish
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          RUN: ${{ github.run_number }}
        run: |
          cat >../notes.md <<EOF
          **Test build** (Windows x64, Linux x86_64) of MailCraft $VERSION (\`${GITHUB_SHA::9}\`, \`$GITHUB_REF_NAME\`), with HTML mail drawn by Blitz and printing.

          Not code-signed: SmartScreen may say "Windows protected your PC": choose *More info › Run anyway*.

          Files: Windows, the \`.msi\` installer or the \`-portable.zip\`; Linux, the \`.AppImage\`, \`.deb\`, \`.rpm\` or \`.tar.gz\`. Check a download against \`SHA256SUMS.txt\`.

          It updates itself to the next test build published here.
          EOF
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
            --title "MailCraft $VERSION (test build $RUN)" \
            --notes-file ../notes.md -- *
          {
            echo "Published **$TAG**:"
            echo
            sed 's/^/    /' SHA256SUMS.txt
          } >>"$GITHUB_STEP_SUMMARY"
